apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.AppName }}-config
  namespace: {{ .Values.NameSpace }}
data:
  my.cnf: |
    [mysqld]
    sql_mode=''
    server-id = {{ .Values.MariadbServerId }}
    log_bin = /var/lib/mysql/mysql-bin.log
    binlog_format = ROW
    expire_logs_days = 7
    max_binlog_size = 100M

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.AppName }}-config
  namespace: {{ .Values.NameSpace }}
data:
  my.cnf: |
    [mysqld]
    sql_mode=''
    server-id = {{ .Values.MariadbServerId }}

    log_bin = OFF

    # InnoDB settings for high-performance writes
    innodb_buffer_pool_size = 12G         # Utilise 75% de la RAM disponible pour InnoDB
    innodb_log_buffer_size = 512M         # Augmente le buffer des logs d'InnoDB pour les écritures fréquentes
    innodb_log_file_size = 1G             # Augmenter la taille des fichiers journaux pour plus de performance
    innodb_flush_log_at_trx_commit = 2    # Meilleure performance en minimisant les écritures disque sur chaque commit
    innodb_flush_method = O_DIRECT        # Améliore les performances d'InnoDB en utilisant l'accès direct au disque
    innodb_file_per_table = 1             # Utilisation de fichiers séparés pour chaque table (améliore la gestion des données)
    innodb_buffer_pool_dump_at_shutdown = 1  # Sauvegarder la mémoire InnoDB à l'arrêt
    innodb_buffer_pool_load_at_startup = 1   # Charger la mémoire InnoDB au démarrage

    # Optimisation du cache de requêtes
    query_cache_type = 0                  # Désactive le cache de requêtes, cela peut être utile pour les bases de données très dynamiques
    query_cache_size = 0                  # Désactive le cache de requêtes
    query_cache_limit = 1M                # Limite les caches de requêtes (inutile si désactivé)

    # Optimisation des buffers de lecture/écriture
    key_buffer_size = 512M                # Augmenter le cache des index MyISAM si vous utilisez MyISAM
    sort_buffer_size = 16M                # Augmente la taille du buffer pour le tri des résultats
    join_buffer_size = 16M                # Augmente la taille du buffer pour les jointures
    read_buffer_size = 4M                 # Augmente la taille du buffer pour la lecture de données
    read_rnd_buffer_size = 4M             # Augmente la taille du buffer pour la lecture aléatoire
    table_open_cache = 2048               # Augmente le nombre de tables ouvertes simultanément

    # Connexions
    max_connections = 1000                # Limite élevée pour les connexions simultanées
    max_allowed_packet = 64M              # Augmente la taille maximale des paquets pour les requêtes

    # Autres optimisations pour la performance des disques et de la mémoire
    tmp_table_size = 512M                 # Augmente la taille des tables temporaires en mémoire
    max_heap_table_size = 512M            # Augmente la taille maximale des tables en mémoire

    # Optimisation de la gestion des transactions et des verrous
    innodb_thread_concurrency = 8         # Nombre de threads maximum que InnoDB peut utiliser simultanément (adapté pour un serveur multi-core)
    innodb_io_capacity = 2000             # Capacité d'entrées/sorties par seconde pour optimiser l'utilisation du disque
    innodb_io_capacity_max = 4000        # Capacité d'entrées/sorties maximale (peut être augmentée si vous avez des SSD rapides)

    # Paramètres de gestion des fichiers temporaires
    tmpdir = /tmp                        # Spécifie le répertoire pour les fichiers temporaires

    # Autres ajustements pour la gestion des ressources système
    open_files_limit = 65535             # Augmente le nombre de fichiers ouverts par le serveur
    thread_cache_size = 128              # Augmente la taille du cache des threads pour les connexions fréquentes

    # Optimisations pour la gestion des logs et des erreurs
    log_error = /var/log/mysql/error.log  # Emplacement du fichier de log des erreurs
    long_query_time = 2                  # Temps au-delà duquel les requêtes lentes sont loguées (ici, 2 secondes)
    slow_query_log = 1                   # Activer l'enregistrement des requêtes lentes
    slow_query_log_file = /var/log/mysql/slow-query.log  # Emplacement des logs des requêtes lentes

    # Sécurisation des connexions
    skip-name-resolve                    # Désactive la résolution de noms DNS pour améliorer les performances
    bind-address = 0.0.0.0                # Permet la connexion depuis toutes les adresses (changer en fonction des besoins de sécurité)

    # Permet de gérer les écritures à haute fréquence
    sync_binlog = 1                       # Synchroniser immédiatement les binlogs (utile si vous activez binlog, mais n'est pas nécessaire ici)

    # Configuration supplémentaire
    innodb_stats_on_metadata = 0          # Désactive les statistiques InnoDB sur les métadonnées des tables (améliore la performance)
    innodb_read_io_threads = 8            # Augmente le nombre de threads pour la lecture des données InnoDB
    innodb_write_io_threads = 8           # Augmente le nombre de threads pour l'écriture des données InnoDB

    # Pour limiter l'utilisation du CPU et de la mémoire dans certaines situations
    innodb_max_dirty_pages_pct = 90       # Indique à InnoDB de commencer à nettoyer quand 90% de la mémoire tampon est "sale"
